# Sample entries. The registry pipeline will replace these with verified entries.
tools:
  - name: sherlock
    display_name: "Sherlock"
    description: "Search for a username across many social networks"
    install:
      method: pip
      package: sherlock-project
    entrypoint:
      command: sherlock
    smoke_args: ["--help"]
    capabilities: ["username-search"]
    accepts: ["username"]

  - name: maigret
    display_name: "Maigret"
    description: "Build a profile from a username across many sites"
    install:
      method: pip
      package: maigret
    entrypoint:
      command: maigret
    capabilities: ["username-search"]
    verified:
      date: "2026-09-22"
      version: "0.6.6"
      os: "Ubuntu 26.04 LTS via WSL2"
      python: "3.12.14"
    accepts: ["username"]

  - name: theharvester
    display_name: "theHarvester"
    description: "Find emails, subdomains and names for a domain"
    repo: "laramies/theHarvester"
    install:
      method: git
      url: https://github.com/laramies/theHarvester.git
      ref: "4.11.1"
      as_package: true
    entrypoint:
      command: theHarvester
    capabilities: ["domain-recon", "email-search"]
    api_keys:
      optional: ["SHODAN_API_KEY", "HUNTER_API_KEY"]
    verified:
      date: "2026-09-22"
      version: "4.11.1"
      os: "Ubuntu 26.04 LTS via WSL2"
      python: "3.12.14"
    accepts: ["domain"]